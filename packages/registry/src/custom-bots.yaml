bots:
  - bot_id: gptbot
    operator: openai
    actor_type: ai_training
    ua_patterns:
      - GPTBot
      - GPTBot/
    ip_source: https://openai.com/gptbot.json
    docs_url: https://platform.openai.com/docs/gptbot

  - bot_id: oai-searchbot
    operator: openai
    actor_type: ai_search
