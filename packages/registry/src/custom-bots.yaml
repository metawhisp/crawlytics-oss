  # --- search engines (with verification metadata) ---

  - bot_id: googlebot
    operator: google
    actor_type: search_engine
    ua_patterns:
      - Googlebot
    ip_source: https://developers.google.com/static/search/apis/ipranges/googlebot.json
    rdns_suffixes:
      - .googlebot.com
      - .google.com

  - bot_id: bingbot
    operator: microsoft
    actor_type: search_engine
    ua_patterns:
      - bingbot
    ip_source: https://www.bing.com/toolbox/bingbot.json
    rdns_suffixes:
      - .search.msn.com

  - bot_id: applebot
    operator: apple
    actor_type: search_engine
    ua_patterns:
      - Applebot
    ip_source: https://search.developer.apple.com/applebot.json
    rdns_suffixes:
      - .applebot.apple.com

  # Verified against the vendors' own documentation on 2026-09-15. These three
  # sat under the heading above for a long time with no way to check them at
  # all, so verify() answered "na" — "the vendor publishes no method" — which
  # for Yandex and Baidu was simply untrue, and a forgery wearing their name
  # got a green badge and never showed up in Security.

  # yandex.com/support/webmaster/robot-workings/check-yandex-robots.html:
  # "All Yandex robots have names ending in yandex.ru, yandex.net or
  # yandex.com", plus a forward lookup that must match — which is what our
  # FCrDNS check already does.
  - bot_id: yandexbot
    operator: yandex
    actor_type: search_engine
    ua_patterns:
      - YandexBot
    rdns_suffixes:
      - .yandex.ru
      - .yandex.net
      - .yandex.com

  # help.baidu.com/question?prod_id=99&class=0&id=3001 (FAQs of Baiduspider,
  # §5): "The hostname of Baiduspider is *.baidu.com or *.baidu.jp. Others are
  # fake hostnames."
  - bot_id: baiduspider
    operator: baidu
    actor_type: search_engine
    ua_patterns:
      - Baiduspider
    rdns_suffixes:
      - .baidu.com
      - .baidu.jp

  # DuckDuckGo publishes addresses, not hostnames — its crawler runs on Azure
  # and the PTRs are generic. The JSON is the same {prefixes:[{ipv4Prefix}]}
  # shape as Google's and Bing's, so extractCidrs reads it unchanged.
  - bot_id: duckduckbot
    operator: duckduckgo
    actor_type: search_engine
    ua_patterns:
      - DuckDuckBot
    ip_source: https://duckduckgo.com/duckduckbot.json

