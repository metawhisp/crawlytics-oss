  # Deliberately left unverifiable, and it is worth writing down why so the
  # next person does not repeat the search. Amazon publishes addresses only as
  # text inside a script-rendered HTML page (developer.amazon.com/amazonbot/
  # ip-addresses/), which is not something fetchJson can read. And reverse
  # lookups of three addresses from that very list, measured 2026-09-15, come
  # back as ec2-*.compute-1.amazonaws.com — a suffix shared with every EC2
  # instance on the internet, so using it would verify anyone who rents one.
  # "na" is the honest answer here; it is not the honest answer for the three
  # search engines above, which is why only those were changed.
  - bot_id: amazonbot
    operator: amazon
    actor_type: ai_training
    ua_patterns:
      - Amazonbot
      - Amazonbot/

  - bot_id: google-extended
    operator: google
    actor_type: ai_training
    ua_patterns:
      - Google-Extended

  - bot_id: duckassistbot
