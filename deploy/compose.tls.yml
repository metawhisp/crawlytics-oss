services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRAWLYTICS_DOMAIN: ${CRAWLYTICS_DOMAIN:?set CRAWLYTICS_DOMAIN in .env}
      CRAWLYTICS_ACME_EMAIL: ${CRAWLYTICS_ACME_EMAIL:?set CRAWLYTICS_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
