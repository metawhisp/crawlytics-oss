services:
  app:
    restart: unless-stopped
    # Built from this checkout by default: there is no public image to pull, and
    # a compose file that points at one turns the documented install into a 403.
    # Set CRAWLYTICS_IMAGE if you publish your own build to a registry.
    image: ${CRAWLYTICS_IMAGE:-crawlytics-app:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Optional: env-seeded ingest keys. A fresh instance can start empty and
      # create sites/keys through the dashboard onboarding wizard instead.
      TC_INGEST_KEYS: ${TC_INGEST_KEYS:-}
      TC_DASHBOARD_PASSWORD: ${TC_DASHBOARD_PASSWORD:-}
      TC_IP_HASH_SECRET: ${TC_IP_HASH_SECRET:?set TC_IP_HASH_SECRET in .env (long random string)}
      # Sites/keys/license persist here (JSON on a mounted volume) so a key entered
      # in the dashboard survives restarts. seedFromEnv still imports TC_INGEST_KEYS.
      CRAWLYTICS_METADATA_FILE: ${CRAWLYTICS_METADATA_FILE:-/data/metadata.json}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-tracecontrol}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracecontrol}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tracecontrol}
    # Bound to localhost, not 0.0.0.0: Caddy (compose.tls.yml) terminates TLS and
    # reverse-proxies over the internal network. Exposing 3000 publicly would
    # bypass TLS. A host-local reverse proxy (e.g. an existing nginx) can still
    # reach 127.0.0.1:3000.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - crawlytics_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:25.5-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-tracecontrol}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracecontrol}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tracecontrol}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_data:
  crawlytics_data:
